<script type="text/x-dc" data-dc-script data-props="{&quot;twentyFourHour&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Time&quot;},&quot;showSeconds&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Time&quot;}}">
class Component extends DCLogic {
  state = { now: new Date() };
  componentDidMount() { this.timer = setInterval(() => this.setState({ now: new Date() }), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const d = this.state.now;
    const p = n => String(n).padStart(2, '0');
    const h24 = this.props.twentyFourHour ?? true;
    const H = d.getHours();
    const h = h24 ? H : (H % 12 || 12);
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const mons = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    return {
      hh: p(h), mm: p(d.getMinutes()), ss: p(d.getSeconds()),
      hhmm: p(h) + ':' + p(d.getMinutes()),
      meridiem: h24 ? 'CET' : (H < 12 ? 'AM' : 'PM'),
      dateLine: days[d.getDay()] + ' ' + d.getDate() + ' ' + mons[d.getMonth()],
      secPct: (d.getSeconds() / 60 * 100).toFixed(1) + '%',
      showSeconds: this.props.showSeconds ?? true
    };
  }
}
</script>
